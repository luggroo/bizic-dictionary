kind = "web"
previewPath = "/"
title = "Tujia Dictionary"
version = "1.0.0"
id = "artifacts/tujia-dictionary"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26049

[services.development]
run = "pnpm --filter @workspace/tujia-dictionary run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tujia-dictionary", "run", "build" ]
publicDir = "artifacts/tujia-dictionary/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26049"
BASE_PATH = "/"
