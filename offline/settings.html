<section id="academy-settings" aria-labelledby="academy-settings-title">
  <div class="academy-setting-row"><label for="ui-language">[[language]]</label><div id="academy-language-field"></div></div>
  <div class="academy-setting-row"><label for="academy-theme">[[appearance]]</label><select id="academy-theme">
    <option value="system">{{system}}</option><option value="light">{{light}}</option><option value="dark">{{dark}}</option>
  </select></div>
  <div class="academy-setting-spelling"><h2>[[spelling]]</h2><div id="academy-spelling-field"></div></div>
  <div class="academy-setting-row"><label for="media-switch">[[media_links]]</label><label id="academy-media-field" for="media-switch"></label></div>
  <a class="academy-setting-link" href="/_app/keyboard">[[keyboard_settings]]{{icon_next}}</a>
  <a class="academy-setting-link" href="/_app/privacy">[[privacy]]{{icon_next}}</a>
</section>
