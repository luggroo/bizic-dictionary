name: Publish Tujia knowledge index
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/prepare-webfonts.py', 'scripts/prepare-search-data.cjs', 'scripts/test-prepared-search.cjs', 'scripts/test-prepared-loader.cjs', 'scripts/apply-gloss-reviews.py', 'scripts/test-reader-copy.cjs', 'scripts/test-loanword-review.cjs', 'scripts/normalize-ipa-data.cjs', 'scripts/refresh-brassett-ipa.cjs', 'scripts/test-brassett-ipa.cjs', 'scripts/test-ipa-normalize.cjs', 'scripts/test-word-merges.cjs', 'scripts/test-word-classes.cjs', 'scripts/test-southern-notation.cjs', 'scripts/test-notation-pairs.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test IPA normalization
        run: |
          node scripts/test-ipa-normalize.cjs
          node scripts/test-brassett-ipa.cjs
          node scripts/test-word-classes.cjs
      - name: Expand website datasets
        run: find site -name '*.gz' -exec gzip -dk {} \;
      - name: Install same-origin Gentium Plus webfonts
        run: python3 scripts/prepare-webfonts.py site
      - name: Apply reviewed Chinese glosses
        run: python3 scripts/apply-gloss-reviews.py site
      - name: Refresh derived Brassett IPA
        run: node scripts/refresh-brassett-ipa.cjs site
      - name: Canonicalize published IPA and deduplicate forms
        run: node scripts/normalize-ipa-data.cjs site
      - name: Check reader-facing copy
        run: node scripts/test-reader-copy.cjs
      - name: Verify merged dictionary IPA and notation rules
        run: |
          node scripts/test-word-merges.cjs
          node scripts/test-southern-notation.cjs
          node scripts/test-southern-source-rimes.cjs
          node scripts/test-notation-pairs.cjs
          node scripts/test-loanword-review.cjs
      - name: Prepare fast dictionary search
        run: |
          node scripts/prepare-search-data.cjs site
          node scripts/test-prepared-search.cjs site
          node scripts/test-prepared-loader.cjs site
      - name: Version browser assets
        run: |
          python3 - <<'PYCODE'
          import hashlib, pathlib, re
          root = pathlib.Path('site')
          page = root / 'index.html'
          def version(match):
              name = match.group(2)
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()[:16]
              return match.group(1) + name + '?v=' + digest + '"'
          html = re.sub(r'(src="|href=")([^"?]+\.(?:js|css))(?:\?[^" ]*)?"', version, page.read_text())
          page.write_text(html)
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
