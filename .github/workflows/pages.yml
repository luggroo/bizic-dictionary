name: Publish Tujia knowledge index
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand website datasets
        run: find site -name '*.gz' -exec gzip -dk {} \;
      - name: Version browser assets
        run: |
          python3 - <<'PYCODE'
          import hashlib, pathlib, re
          root = pathlib.Path('site')
          page = root / 'index.html'
          def version(match):
              name = match.group(2)
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()[:16]
              return match.group(1) + name + '?v=' + digest + '"'
          html = re.sub(r'(src="|href=")([^"?]+\.(?:js|css))(?:\?[^" ]*)?"', version, page.read_text())
          page.write_text(html)
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
