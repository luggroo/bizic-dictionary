name: Check translation Skill compatibility
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/check-skill-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source snapshot with the production conversion steps
        run: |
          find site -name '*.gz' -exec gzip -dk {} \;
          python3 scripts/prepare-webfonts.py site
          python3 scripts/apply-gloss-reviews.py site
          node scripts/refresh-brassett-ipa.cjs site
          node scripts/normalize-ipa-data.cjs site
          node scripts/prepare-search-data.cjs site
      - name: Check canonical inputs, identity fingerprints and public routes
        run: |
          node scripts/test-skill-contract.cjs site
          node scripts/test-prepared-search.cjs site
          node scripts/test-prepared-version.cjs site
      - name: Browser test static evidence with JavaScript disabled
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/bizic-contract-qa --no-save --ignore-scripts --silent playwright@1.58.2
          NODE_PATH=/tmp/bizic-contract-qa/node_modules node scripts/test-readable-dictionary.cjs site
