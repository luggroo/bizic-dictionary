openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Tujia Dictionary API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: languages
  - name: entries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [languages]
      summary: List all supported translation languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /dialects:
    get:
      operationId: listDialects
      tags: [entries]
      summary: List all Tujia varieties and dialects
      responses:
        "200":
          description: Varieties and dialects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DialectInfo"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List and search dictionary entries
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query across Tujia forms and all translation languages
        - name: language
          in: query
          schema:
            type: string
          description: Language code to restrict search to (e.g. zh, en, ja)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by semantic category
        - name: variety
          in: query
          schema:
            type: string
          description: Filter by Tujia variety — 'northern' or 'southern'
        - name: dialect
          in: query
          schema:
            type: string
          description: Filter by dialect name (e.g. Longshan, Laifeng)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"

  /entries/stats:
    get:
      operationId: getDictionaryStats
      tags: [entries]
      summary: Get dictionary statistics
      responses:
        "200":
          description: Dictionary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryStats"

  /entries/categories:
    get:
      operationId: listCategories
      tags: [entries]
      summary: List all categories
      responses:
        "200":
          description: List of categories with entry counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single dictionary entry with all translations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry with translations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryDetail"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}/cognates:
    get:
      operationId: getEntryCognates
      tags: [entries]
      summary: Get cognate groups linked to this entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cognate groups linked to the entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryCognatesResponse"

  /entries/{id}/related:
    get:
      operationId: getRelatedEntries
      tags: [entries]
      summary: Get entries related to this one (same category)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Related entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrySummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Language:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        flag:
          type: string
        isBase:
          type: boolean
        sortOrder:
          type: integer
      required: [id, code, name, nativeName, flag, isBase, sortOrder]

    DialectInfo:
      type: object
      properties:
        variety:
          type: string
          description: "northern or southern"
        dialect:
          type: string
          description: Dialect name (e.g. Longshan, Laifeng)
        count:
          type: integer
          description: Number of entries in this dialect
      required: [variety, dialect, count]

    TujiaForms:
      type: object
      description: The four orthographic/phonetic representations of a Tujia word
      properties:
        spelling:
          type: string
          nullable: true
          description: "Bifzivkar romanization without tones (e.g. bifzivkar)"
        toned:
          type: string
          nullable: true
          description: "Bifzivkar with pinyin-style tone diacritics (e.g. bízìkǎ)"
        ipa:
          type: string
          nullable: true
          description: "International Phonetic Alphabet (e.g. pi²zi³ka³)"
        swMandarin:
          type: string
          nullable: true
          description: "Southwest Mandarin sound-alikes in Chinese characters (e.g. 币子卡)"
      required: []

    Translation:
      type: object
      properties:
        id:
          type: integer
        languageCode:
          type: string
        languageName:
          type: string
        languageNativeName:
          type: string
        flag:
          type: string
        text:
          type: string
        romanization:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required: [id, languageCode, languageName, languageNativeName, flag, text]

    CognateGroup:
      type: object
      properties:
        groupId:
          type: integer
        wiktionaryNo:
          type: integer
          nullable: true
        protoForm:
          type: string
          nullable: true
        glossEn:
          type: string
        glossZh:
          type: string
          nullable: true
      required: [groupId, glossEn]

    EntryCognatesResponse:
      type: object
      properties:
        cognates:
          type: array
          items:
            $ref: "#/components/schemas/CognateGroup"
      required: [cognates]

    EntrySummary:
      type: object
      properties:
        id:
          type: integer
        tujiaWord:
          type: string
        variety:
          type: string
          description: "northern or southern"
        dialect:
          type: string
          nullable: true
        forms:
          $ref: "#/components/schemas/TujiaForms"
        partOfSpeech:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: "Academic source citation(s), e.g. 'Tian 86' or 'Sun H 91 ZMYY / Brassett 04 Tujia'"
        primaryTranslations:
          type: object
          additionalProperties:
            type: string
      required: [id, tujiaWord, variety, forms, primaryTranslations]

    EntryDetail:
      type: object
      properties:
        id:
          type: integer
        tujiaWord:
          type: string
        variety:
          type: string
        dialect:
          type: string
          nullable: true
        forms:
          $ref: "#/components/schemas/TujiaForms"
        partOfSpeech:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: "Academic source citation(s), e.g. 'Tian 86' or 'Sun H 91 ZMYY / Brassett 04 Tujia'"
        exampleSentence:
          type: string
          nullable: true
        exampleTranslation:
          type: string
          nullable: true
        culturalNote:
          type: string
          nullable: true
        translations:
          type: array
          items:
            $ref: "#/components/schemas/Translation"
        cognates:
          type: array
          items:
            $ref: "#/components/schemas/CognateGroup"
        createdAt:
          type: string
      required: [id, tujiaWord, variety, forms, translations, cognates, createdAt]

    EntryListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntrySummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [entries, total, page, limit, totalPages]

    DictionaryStats:
      type: object
      properties:
        totalEntries:
          type: integer
        totalLanguages:
          type: integer
        totalTranslations:
          type: integer
        totalCategories:
          type: integer
        northernCount:
          type: integer
        southernCount:
          type: integer
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
        recentEntries:
          type: array
          items:
            $ref: "#/components/schemas/EntrySummary"
      required: [totalEntries, totalLanguages, totalTranslations, totalCategories, northernCount, southernCount, languages, recentEntries]

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required: [category, count]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
